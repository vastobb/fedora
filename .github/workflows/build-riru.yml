name: "Build riru (NDK, Actions-only)"

on:
  workflow_dispatch:
  push:
    paths:
      - "riru/**"
      - ".github/workflows/build-riru.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android NDK r27
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27

      - name: Configure (arm64-v8a)
        run: |
          set -eux
          export ANDROID_NDK_HOME="${{ steps.setup-ndk.outputs.ndk-path }}"
          cmake -S riru -B build/riru \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DRIRU_USE_HOOKS=OFF

      - name: Build
        run: cmake --build build/riru --verbose

      - name: Validate + package .levipack
        run: |
          set -eux
          python3 tools/package_riru.py --so build/riru/out/arm64-v8a/libRiru.so --out dist/
          ls -lh dist/
          tar -tf dist/riru.levipack

      - name: Upload riru artifact
        uses: actions/upload-artifact@v4
        with:
          name: riru-levipack
          path: |
            dist/riru.levipack
            dist/riru/
